[package]
name = "recall-cli"
description = "The recall command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "recall"
path = "src/main.rs"

[dependencies]
recall-core = { path = "../recall-core" }
recall-adapters = { version = "0.1.0", path = "../recall-adapters" }
recall-store = { path = "../recall-store" }
recall-index = { path = "../recall-index" }
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
time = "0.3.45"

[dev-dependencies]
tempfile = "3.27.0"
